[project]
name = "laminate-analyzer-mcp"
version = "0.7.2"
description = "적층 복합재 중립면·ABD·평가 지표를 결정론적으로 계산하는 MCP 서버 (stdio + HEAXHub streamable HTTP)"
requires-python = ">=3.12"
dependencies = [
    # mcp<2 핀: 2.0.0은 FastMCP를 제거하고 httpx→httpx2로 바꿔 이 코드와 비호환 (materialtwin과 동일 결정)
    "mcp>=1.10,<2",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.27",
    "anyio>=4",
    "pytest-cov>=5",
    "sympy>=1.12",
]

[project.scripts]
laminate-mcp = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
